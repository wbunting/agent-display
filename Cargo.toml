[package]
name = "agent-display"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Private headless sway display, input and agent-only Chromium for agents (Rust port)"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "agent-display"
path = "src/main.rs"

# Benchmark build with per-phase timings (not installed):
#   cargo build --release --features bench-trace
[[bin]]
name = "agent-display-trace"
path = "src/bin/agent-display-trace.rs"
required-features = ["bench-trace"]

[features]
bench-trace = []

[dependencies]
# JSON for CDP, sway IPC and the CLI's output. preserve_order: printed
# objects keep the key order Chromium/sway sent, like Python's dicts.
serde_json = { version = "1", features = ["preserve_order"] }
# memfd_create, sendmsg(SCM_RIGHTS), poll, flock, umask, pidfd_open, getuid.
libc = "0.2"
# `tab show --until-url REGEX`: small, no Unicode tables.
regex-lite = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
